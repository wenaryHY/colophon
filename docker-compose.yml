services:
  colophon:
    build: .
    # 换成你推到 Docker Hub 后的镜像名：
    # image: yourname/colophon:latest
    ports:
      - "${COLOPHON_PORT:-3000}:3000"
    volumes:
      - colophon-data:/app/data
      - colophon-uploads:/app/uploads
      - colophon-backups:/app/backups
    environment:
      COLOPHON__RUNTIME__MODE: "production"
      COLOPHON__AUTH__SECRET: "${COLOPHON_AUTH_SECRET:?Set COLOPHON_AUTH_SECRET to a strong random value before starting Colophon}"
      # S3 备份（可选，设了就自动启用）
      LITESTREAM_S3_BUCKET: "${LITESTREAM_S3_BUCKET:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  colophon-data:
  colophon-uploads:
  colophon-backups:
