<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<script>
(function(){var t=localStorage.getItem('colophon-theme');
if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
document.documentElement.setAttribute('data-theme','dark');})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="content-language" content="{{ current_lang }}">
<link rel="icon" type="image/svg+xml" href="/static/logo-icon.svg">
<link rel="apple-touch-icon" href="/static/logo-icon.svg">
<title>500 - 服务器错误 | {{ site_title }}</title>
<meta name="description" content="服务器出错了，我们正在努力修复。">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ theme_assets_url('css/theme.css') }}">
{{ plugin_head|safe }}
<style>
.error-page {
  min-height: calc(100vh - 200px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

.error-container {
  max-width: 28rem;
  text-align: center;
}

.error-code {
  font-size: 8rem;
  font-weight: 700;
  line-height: 1;
  color: var(--border);
  margin: 0 0 1.5rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.error-title {
  font-size: 1.5rem;
  font-weight: 600;
  margin: 0 0 1rem;
  color: var(--text);
  font-family: 'Noto Sans SC', serif;
  line-height: 1.3;
}

.error-message {
  font-size: 0.9375rem;
  color: var(--muted);
  line-height: 1.6;
  margin: 0 0 2rem;
}

.error-actions {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  align-items: center;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  background: var(--accent);
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 500;
  font-size: 0.9375rem;
  transition: all 0.2s ease;
}

.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.btn-primary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.625rem 1.25rem;
  color: var(--muted);
  text-decoration: none;
  border-radius: 8px;
  font-size: 0.875rem;
  transition: color 0.2s;
  cursor: pointer;
  background: none;
  border: none;
}

.btn-secondary:hover {
  color: var(--text);
}

.btn-secondary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 640px) {
  .error-code {
    font-size: 5rem;
  }
  
  .error-title {
    font-size: 1.25rem;
  }
  
  .error-message {
    font-size: 0.875rem;
  }
}

/* 暗色模式优化 */
[data-theme="dark"] .error-code {
  color: rgba(255, 255, 255, 0.1);
}
</style>
</head>
<body>
{% include "_header.html" %}
<div class="wrap">

  <main class="error-page">
    <div class="error-container">
      <h1 class="error-code" aria-label="错误代码 500">500</h1>
      <h2 class="error-title">服务器出错了</h2>
      <p class="error-message">
        我们正在努力修复这个问题。请稍后再试，或者返回首页继续浏览。
      </p>
      <nav class="error-actions" aria-label="导航选项">
        <a href="/" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          返回首页
        </a>
        <button onclick="location.reload()" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
          刷新页面
        </button>
      </nav>
    </div>
  </main>

  {% include "_footer.html" %}
</div>

<script src="{{ theme_assets_url('js/theme.js') }}"></script>
{{ plugin_body|safe }}
</body>
</html>
