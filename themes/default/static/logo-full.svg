  <!-- Icon: 32px icon centered vertically in 40px viewBox (y=(40-32)/2=4) -->
  <use href="#scroll-icon" x="2" y="4"/>

  <!-- ===== PIXEL FONT: COLOPHON (5x5 letters, 1px gap, x=38, y=17) ===== -->
  <g transform="translate(38, 17)" fill="#4a2a0a" shape-rendering="crispEdges">

    <!-- C (01110 10000 10000 10000 01110) offset 0, x=0..4 -->
    <rect x="1" y="0" width="3" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="0" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="3" height="1"/>

    <!-- O (01110 10001 10001 10001 01110) offset 6, x=6..10 -->
    <rect x="7"  y="0" width="3" height="1"/>
    <rect x="6"  y="1" width="1" height="1"/>
    <rect x="10" y="1" width="1" height="1"/>
    <rect x="6"  y="2" width="1" height="1"/>
    <rect x="10" y="2" width="1" height="1"/>
    <rect x="6"  y="3" width="1" height="1"/>
    <rect x="10" y="3" width="1" height="1"/>
    <rect x="7"  y="4" width="3" height="1"/>

    <!-- L (10000 10000 10000 10000 11111) offset 12, x=12..16 -->
    <rect x="12" y="0" width="1" height="1"/>
    <rect x="12" y="1" width="1" height="1"/>
    <rect x="12" y="2" width="1" height="1"/>
    <rect x="12" y="3" width="1" height="1"/>
    <rect x="12" y="4" width="5" height="1"/>

    <!-- O offset 18, x=18..22 -->
    <rect x="19" y="0" width="3" height="1"/>
    <rect x="18" y="1" width="1" height="1"/>
    <rect x="22" y="1" width="1" height="1"/>
    <rect x="18" y="2" width="1" height="1"/>
    <rect x="22" y="2" width="1" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="22" y="3" width="1" height="1"/>
    <rect x="19" y="4" width="3" height="1"/>

    <!-- P (11110 10001 11110 10000 10000) offset 24, x=24..28 -->
    <rect x="24" y="0" width="4" height="1"/>
    <rect x="24" y="1" width="1" height="1"/>
    <rect x="28" y="1" width="1" height="1"/>
    <rect x="24" y="2" width="4" height="1"/>
    <rect x="24" y="3" width="1" height="1"/>
    <rect x="24" y="4" width="1" height="1"/>

    <!-- H (10001 10001 11111 10001 10001) offset 30, x=30..34 -->
    <rect x="30" y="0" width="1" height="1"/>
    <rect x="34" y="0" width="1" height="1"/>
    <rect x="30" y="1" width="1" height="1"/>
    <rect x="34" y="1" width="1" height="1"/>
    <rect x="30" y="2" width="5" height="1"/>
    <rect x="30" y="3" width="1" height="1"/>
    <rect x="34" y="3" width="1" height="1"/>
    <rect x="30" y="4" width="1" height="1"/>
    <rect x="34" y="4" width="1" height="1"/>

    <!-- O offset 36, x=36..40 -->
    <rect x="37" y="0" width="3" height="1"/>
    <rect x="36" y="1" width="1" height="1"/>
    <rect x="40" y="1" width="1" height="1"/>
    <rect x="36" y="2" width="1" height="1"/>
    <rect x="40" y="2" width="1" height="1"/>
    <rect x="36" y="3" width="1" height="1"/>
    <rect x="40" y="3" width="1" height="1"/>
    <rect x="37" y="4" width="3" height="1"/>

    <!-- N (10001 11001 10101 10011 10001) offset 42, x=42..46 -->
    <rect x="42" y="0" width="1" height="1"/>
    <rect x="46" y="0" width="1" height="1"/>
    <rect x="42" y="1" width="2" height="1"/>
    <rect x="46" y="1" width="1" height="1"/>
    <rect x="42" y="2" width="1" height="1"/>
    <rect x="44" y="2" width="1" height="1"/>
    <rect x="46" y="2" width="1" height="1"/>
    <rect x="42" y="3" width="1" height="1"/>
    <rect x="45" y="3" width="2" height="1"/>
    <rect x="42" y="4" width="1" height="1"/>
    <rect x="46" y="4" width="1" height="1"/>

