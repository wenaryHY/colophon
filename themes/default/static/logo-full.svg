      <rect x="23" y="17" width="1" height="1" fill="#2a1a0a"/>
      <rect x="24" y="17" width="1" height="1" fill="#2a1a0a"/>
      <rect x="20" y="18" width="1" height="1" fill="#2a1a0a"/>
