      <rect x="4" y="10" width="1"  height="3"  fill="#8b6914"/>
      <rect x="4" y="13" width="1"  height="6"  fill="#6b4f10"/>
      <rect x="4" y="19" width="1"  height="5"  fill="#4a3608"/>
      <rect x="4" y="24" width="1"  height="1"  fill="#2a1a0a"/>
      <rect x="3" y="9"  width="1"  height="16" fill="#2a1a0a"/>
      <rect x="5" y="9"  width="1"  height="16" fill="#2a1a0a"/>
