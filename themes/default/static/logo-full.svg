      <rect x="27" y="14" width="1"  height="6"  fill="#6b4f10"/>
      <rect x="27" y="20" width="1"  height="4"  fill="#4a3608"/>
      <rect x="27" y="24" width="1"  height="1"  fill="#2a1a0a"/>
      <rect x="26" y="10" width="1"  height="15" fill="#2a1a0a"/>
      <rect x="28" y="10" width="1"  height="15" fill="#2a1a0a"/>
      <rect x="26" y="25" width="3"  height="1"  fill="#2a1a0a"/>

