      <rect x="8"  y="12" width="6" height="1" fill="#5a4a2a"/>
      <rect x="15" y="12" width="6" height="1" fill="#5a4a2a"/>
      <rect x="22" y="12" width="3" height="1" fill="#5a4a2a"/>
      <rect x="8"  y="14" width="5" height="1" fill="#5a4a2a"/>
      <rect x="14" y="14" width="4" height="1" fill="#5a4a2a"/>
