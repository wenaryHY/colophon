<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - {{ site_title | default("Colophon") }}</title>
<link rel="preload" href="{{ theme_assets_url('fonts/source-sans-3-400.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ theme_assets_url('fonts/eb-garamond-600.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ theme_assets_url('css/fonts.css') }}">
<link rel="stylesheet" href="{{ theme_assets_url('css/theme.css') }}">
<style>
.account-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-stack-lg) var(--space-margin-mobile);
}
</style>
</head>
<body class="account-page">

<section class="form-card" aria-labelledby="registerTitle">
  <a href="/" class="site-nav__logo" style="display:block; font-size: 24px; margin-bottom: var(--space-stack-md);">Colophon</a>

  <h1 id="registerTitle" class="form-card__title">创建你的账号</h1>
  <p class="form-card__subtitle">登录状态自动同步，为每一次落笔留下印记。</p>

  <div id="errorAlert" class="alert" role="alert"></div>

  <form id="registerForm" class="form-stack">
    <div class="form-field">
      <label for="username" class="form-field__label">用户名</label>
      <input id="username" name="username" type="text" class="form-field__input" placeholder="设置用户名" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="email" class="form-field__label">邮箱</label>
      <input id="email" name="email" type="email" class="form-field__input" placeholder="name@example.com" autocomplete="email" required>
    </div>
    <div class="form-field">
      <label for="displayName" class="form-field__label">显示名称</label>
      <input id="displayName" name="display_name" type="text" class="form-field__input" placeholder="对外显示的名称（可选）">
    </div>
    <div class="form-field">
      <label for="password" class="form-field__label">密码</label>
      <input id="password" name="password" type="password" class="form-field__input" placeholder="至少 6 位" autocomplete="new-password" required>
    </div>
    <button id="submitBtn" type="submit" class="btn btn-primary" style="margin-top: 8px; padding: 14px 24px;">注册账号</button>
  </form>

  <div class="form-card__footer">
    <a href="/login?redirect={{ redirect_to }}">已有账号？去登录</a>
    <a class="muted" href="/">返回首页</a>
  </div>
</section>

<script src="{{ theme_assets_url('js/site-api.js') }}"></script>
<script>
const redirectTo = {{ redirect_to | tojson_script | safe }};
const alertEl = document.getElementById('errorAlert');

document.getElementById('registerForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('submitBtn');
  button.disabled = true;
  alertEl.style.display = 'none';

  try {
    await window.ColophonApi.register({
      username: document.getElementById('username').value.trim(),
      email: document.getElementById('email').value.trim(),
      display_name: document.getElementById('displayName').value.trim() || null,
      password: document.getElementById('password').value,
    });
    const user = await window.ColophonApi.checkLoginStatus();
    if (!user) {
      throw new Error('注册成功但登录会话建立失败，请手动登录。');
    }
    window.location.href = redirectTo;
  } catch (error) {
    alertEl.textContent = error.message || '注册失败，请稍后重试。';
    alertEl.className = 'alert is-error';
    alertEl.style.display = 'block';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
