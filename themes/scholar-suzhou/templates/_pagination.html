<nav class="pagination" aria-label="分页导航">
  <div class="pagination-inner">
    {% if page > 1 %}
    <a href="?page={{ page - 1 }}{% if pagination_base_query %}&{{ pagination_base_query }}{% endif %}" class="pagination-btn pagination-prev" rel="prev">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span>上一页</span>
    </a>
    {% else %}
    <span class="pagination-btn pagination-prev pagination-disabled">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span>上一页</span>
    </span>
    {% endif %}

    <span class="pagination-info">
      第 <strong>{{ page }}</strong> / {{ total_pages }} 页
    </span>

    {% if page < total_pages %}
    <a href="?page={{ page + 1 }}{% if pagination_base_query %}&{{ pagination_base_query }}{% endif %}" class="pagination-btn pagination-next" rel="next">
      <span>下一页</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    {% else %}
    <span class="pagination-btn pagination-next pagination-disabled">
      <span>下一页</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
    {% endif %}
  </div>
</nav>
