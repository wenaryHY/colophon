[server]
host = "0.0.0.0"
port = 2000

[database]
url = "sqlite://inkforge.db?mode=rwc"

[auth]
secret = "inkforge-change-me-in-production"
expires_in_seconds = 900
turnstile_secret = ""
turnstile_site_key = ""

[storage]
upload_dir = "uploads"
max_upload_size_mb = 10

[theme]
theme_dir = "themes"
active_theme_fallback = "default"
default_mode = "system"

[webhook]
max_concurrency = 5    # webhook 发送最大并发数
timeout_seconds = 60   # 全部 webhook 总超时秒数

[paths]
admin_dist_dir = "src/admin/dist"
