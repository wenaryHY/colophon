<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wenary · 关于</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & VARIABLES — Dark theme, Google-style
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:        #ff6b35;
  --accent-muted:  rgba(255, 107, 53, 0.18);
  --accent-soft:   rgba(255, 107, 53, 0.08);
  --bg:            #0d0d0d;
  --surface:       #141414;
  --surface-hover: #1a1a1a;
  --text:          #ececec;
  --text-secondary:#9e9e9e;
  --text-muted:    #6b6b6b;
  --border:        rgba(255, 255, 255, 0.07);
  --border-hover:  rgba(255, 255, 255, 0.12);
  --radius:        12px;
  --font-sans:     'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;

  --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ============================================================
   BASE
   ============================================================ */
html { font-size: 16px; }

body {
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ============================================================
   BACKGROUND ORB — 巨大模糊橙色光晕，左上角，缓慢漂移
   ============================================================ */
.bg-orb {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  top: -280px;
  left: -200px;
  width: 860px;
  height: 860px;
  border-radius: 50%;
  background: radial-gradient(
    circle at center,
    rgba(255, 107, 53, 0.14) 0%,
    rgba(255, 107, 53, 0.07) 30%,
    rgba(255, 107, 53, 0.02) 55%,
    transparent 70%
  );
  filter: blur(130px);
  animation: drift 20s ease-in-out infinite;
}

@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  20%      { transform: translate(80px, 30px) scale(1.04); }
  40%      { transform: translate(40px, 90px) scale(0.97); }
  60%      { transform: translate(-30px, 60px) scale(1.03); }
  80%      { transform: translate(20px, -10px) scale(0.98); }
}

/* ============================================================
   LAYOUT
   ============================================================ */
.page {
  position: relative;
  z-index: 1;
  max-width: 1120px;
  margin: 0 auto;
  padding: 80px 40px 60px;
}

/* ============================================================
   HERO — 名字从下方 60px 滑入，Apple/Google 风格超大标题
   ============================================================ */
.hero {
  padding: 0 0 48px;
}

.name {
  font-family: var(--font-sans);
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1.05;
  opacity: 0;
  transform: translateY(60px);
  animation: heroReveal 0.85s var(--ease-out-expo) forwards;
  animation-delay: 0.1s;
}

@keyframes heroReveal {
  from { opacity: 0; transform: translateY(60px); }
  to   { opacity: 1; transform: translateY(0); }
}

.subtitle {
  font-size: 1.05rem;
  font-weight: 400;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(24px);
  animation: heroReveal 0.7s var(--ease-out-expo) forwards;
  animation-delay: 0.3s;
}

.subtitle-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ============================================================
   CONTENT GRID — 桌面端双栏非对称布局
   左：关于 + 技术栈   右：InkForge + 联系（视觉元素）
   ============================================================ */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 48px 64px;
  align-items: start;
}

.col-left  { display: flex; flex-direction: column; gap: 56px; }
.col-right { display: flex; flex-direction: column; gap: 48px; }

/* ============================================================
   SECTION BLOCK — 共用间距，大留白呼吸感
   ============================================================ */
.section {
  /* spacing handled by parent gap */
}

.section-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 20px;
}

/* ============================================================
   ABOUT — 简短 tagline 风格
   ============================================================ */
.about-text {
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--text-secondary);
  max-width: 520px;
}

/* ============================================================
   TECH TAGS — 7 个标签，hover 轻微上浮 + 边框变橙
   ============================================================ */
.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.tag {
  display: inline-flex;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 8px 22px;
  cursor: default;
  white-space: nowrap;
  transition:
    transform 0.3s var(--ease-out-expo),
    border-color 0.35s ease,
    color 0.35s ease,
    background 0.35s ease;
}

.tag:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

/* ============================================================
   PROJECT CARD (InkForge) — 右侧视觉元素
   ============================================================ */
.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  transition:
    border-color 0.35s ease,
    background 0.35s ease;
}

.project-card:hover {
  border-color: var(--border-hover);
  background: var(--surface-hover);
}

.project-card .section-label {
  margin-bottom: 14px;
}

.project-name {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
}

.project-desc {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--text-secondary);
  margin-bottom: 24px;
}

/* ============================================================
   LINK — 橙色下划线从左滑入
   ============================================================ */
.link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  padding-bottom: 3px;
}

.link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1.5px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s var(--ease-out-expo);
}

.link:hover::after {
  transform: scaleX(1);
}

.link-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  transition: transform 0.3s var(--ease-out-expo);
}

.link:hover .link-icon {
  transform: translate(2px, -2px);
}

/* ============================================================
   CONTACT
   ============================================================ */
.contact-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.contact-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
  transition: background 0.3s ease, transform 0.3s var(--ease-out-expo);
}

.contact-item:hover .contact-icon {
  background: var(--accent-muted);
  transform: scale(1.08);
}

.contact-link {
  color: var(--text);
  font-weight: 500;
  text-decoration: none;
  position: relative;
  padding-bottom: 2px;
}

.contact-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--ease-out-expo);
}

.contact-link:hover::after {
  transform: scaleX(1);
}

/* ============================================================
   SCROLL REVEAL — IntersectionObserver，从下方 40px 淡入
   ============================================================ */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition:
    opacity 0.75s var(--ease-out-expo),
    transform 0.75s var(--ease-out-expo);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* stagger：标签逐个出现 */
.reveal.visible .tag {
  opacity: 0;
  animation: tagReveal 0.5s var(--ease-out-expo) forwards;
}

.reveal.visible .tag:nth-child(1) { animation-delay: 0.05s; }
.reveal.visible .tag:nth-child(2) { animation-delay: 0.10s; }
.reveal.visible .tag:nth-child(3) { animation-delay: 0.15s; }
.reveal.visible .tag:nth-child(4) { animation-delay: 0.20s; }
.reveal.visible .tag:nth-child(5) { animation-delay: 0.25s; }
.reveal.visible .tag:nth-child(6) { animation-delay: 0.30s; }
.reveal.visible .tag:nth-child(7) { animation-delay: 0.35s; }

@keyframes tagReveal {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   RESPONSIVE — 移动端单栏
   ============================================================ */
@media (max-width: 900px) {
  .content-grid {
    grid-template-columns: 1fr;
    gap: 48px;
  }

  .page {
    padding: 60px 24px 48px;
  }

  .project-card {
    padding: 28px 24px;
  }
}

@media (max-width: 600px) {
  html { font-size: 15px; }

  .page {
    padding: 40px 16px 36px;
  }

  .hero {
    padding-bottom: 36px;
  }

  .name {
    font-size: 2.8rem;
  }

  .subtitle {
    font-size: 0.95rem;
    margin-top: 12px;
  }

  .content-grid {
    gap: 40px;
  }

  .col-left { gap: 40px; }
  .col-right { gap: 36px; }

  .about-text {
    font-size: 0.95rem;
  }

  .tag {
    font-size: 0.78rem;
    padding: 6px 18px;
  }

  .project-card {
    padding: 24px 20px;
    border-radius: 10px;
  }

  .bg-orb {
    top: -200px;
    left: -140px;
    width: 500px;
    height: 500px;
    filter: blur(100px);
  }
}
</style>
</head>
<body>

<!-- ============================================================

<div class="bg-orb" aria-hidden="true"></div>

</div>

<!-- ============================================================
     SCRIPT — IntersectionObserver 滚动揭示
     ============================================================ -->
<script>
(function() {
  'use strict';

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  var reveals = document.querySelectorAll('.reveal');
  for (var i = 0; i < reveals.length; i++) {
    observer.observe(reveals[i]);
  }
})();
</script>
