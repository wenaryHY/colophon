[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "colophon"
version = "1.0.0"
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.75"

[package.metadata.sqlx]
offline = true

[[bin]]
name = "colophon"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
walkdir = "=2.5.0"

[dependencies]
# Web 框架
axum = { version = "=0.8.9", features = ["multipart", "macros", "ws"] }

# OpenAPI 文档（utoipa 5.5 + swagger-ui 9.0 已支持 axum 0.8）
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }
multer = "3"
futures-util = "=0.3.32"
axum-extra = { version = "=0.10.0", features = ["typed-header", "cookie"] }
tokio = { version = "=1.51.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
zenwebp = "0.4"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
tower = { version = "=0.5.2" }
tower-http = { version = "=0.6.8", features = ["cors", "fs", "trace", "set-header", "compression-gzip"] }

# 数据库
sqlx = { version = "=0.7.4", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }

# 序列化
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.8.2"

# 模板引擎
minijinja = { version = "=2.19.0", features = ["loader", "fuel"] }

# 认证
governor = "=0.10.4"
axum-governor = "=2.0.2"
jsonwebtoken = "=9.3.1"
argon2 = "=0.5.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rand = "=0.8.5"

# 工具
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.44", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "=1.0.102"
clap = { version = "=4.6.1", features = ["derive"] }
thiserror = "=1.0.69"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
config = "=0.14.1"
once_cell = "=1.21.4"
slug = "=0.1.6"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
bytes = "=1.11.1"
mime_guess = "=2.0.5"
zip = "=2.4.2"
sha2 = "=0.10.9"
semver = "1"
base64 = "=0.22.1"
hex = "=0.4.3"
url = "=2.5.8"
ammonia = "=4.1.2"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"

extism = "1.30"

tokio-cron-scheduler = "=0.9.4"
cron = "0.12"
aws-config = { version = "=1.8.15", optional = true }
aws-sdk-s3 = { version = "=1.119.0", optional = true }
notify = "6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[features]
default = []
test-mode = []
s3 = ["aws-config", "aws-sdk-s3"]




# ===== 日常开发 =====
[profile.dev]
debug = 1                # 行号表，panic 堆栈够用
strip = "none"           # panic 能溯源
lto = false
codegen-units = 256      # 显式声明，防未来默认值变化

[profile.dev.build-override]
opt-level = 3
debug = 0
strip = true             # build 依赖完全不用调试

# ===== 排查崩溃 ===== cargo build --profile dev-debug
[profile.dev-debug]
inherits = "dev"
debug = 2
strip = "none"

# ===== CI/日常验证 ===== cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

# ===== 最终部署 ===== cargo build --release
[profile.release]
opt-level = "s"          # 二进制最小（保留当前值）
lto = true               # fat LTO（保留当前值）
codegen-units = 1        # 极致优化（保留当前值）
strip = "symbols"

[profile.bench]
debug = true

[dev-dependencies]
serial_test = "=3.4.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3"

[[bench]]
name = "api_benchmarks"
harness = false

