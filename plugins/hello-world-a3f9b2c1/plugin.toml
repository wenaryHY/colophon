[plugin]
id = "hello-world-a3f9b2c1"
title = "Hello World"
version = "0.1.0"
description = "Wasm 插件示例：拦截 post.before_save Filter 钩子，修改标题和正文"
author = "Colophon Team"

[engine]
colophon = ">=1.0.0"

[hooks]
listen = [
  { event = "post.before_save", type = "filter" }
]

[[settings]]
key = "greeting_target"
label = "问候对象"
type = "text"
default = "World"
description = "hello_world 模板函数的默认参数"

[admin]
enabled = true
entry = "settings.html"
